name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit and integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = unit tests, then integration tests against a real PostgreSQL started by Testcontainers
      # (Docker is available on GitHub's Ubuntu runners), then the JaCoCo coverage report.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-checks first, then bundles.
      - run: npm run build

  docker:
    name: Docker (build images, start the stack, smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Create throwaway secrets for this run only
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "BOOTSTRAP_ADMIN_EMAIL=ci-admin@example.com"
            echo "BOOTSTRAP_ADMIN_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "WEB_PORT=8081"
          } > .env
      - name: Build and start everything
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through the web port
        run: |
          set -euo pipefail
          base=http://localhost:8081
          set -a; . ./.env; set +a

          curl -fsS "$base/" | grep -qi "<div id=\"root\""                      # the web app is served
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/student/seats")" = 200   # client-side routes load
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/books")" = 401    # the API demands a token
          curl -fsS "$base/v3/api-docs" | grep -q '"ChapelBook API"'                        # the API is documented

          token=$(curl -fsS -X POST "$base/api/v1/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$BOOTSTRAP_ADMIN_EMAIL\",\"password\":\"$BOOTSTRAP_ADMIN_PASSWORD\"}" \
            | sed -E 's/.*"accessToken":"([^"]+)".*/\1/')
          curl -fsS "$base/api/v1/statistics/overview" -H "Authorization: Bearer $token" | grep -q '"catalogue"'
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Tear down
        if: always()
        run: docker compose down -v
