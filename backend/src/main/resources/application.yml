spring:
  application:
    name: chapelbook
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chapelbook}
    username: ${DB_USERNAME:chapelbook}
    # No default: supply DB_PASSWORD through the environment (see .env.example).
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  autoconfigure:
    exclude:
      # Users live in our own table; this stops Spring creating a default in-memory user
      # with a generated password that is printed to the log.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # No default secret: set JWT_SECRET (at least 32 characters, e.g. `openssl rand -base64 48`).
    secret: ${JWT_SECRET:}
    expiration: PT1H
  bootstrap:
    # Optional: create the first admin on startup if none exists. Both empty by default.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  library:
    # Library policy. Every value here is optional; the code falls back to these same defaults.
    reservation-hold-days: 3        # days a held copy waits to be collected
    max-active-reservations: 5      # reservations one student may have at once
    loan-days: 14                   # loan period
    max-loans-per-student: 5        # books out at once
    max-renewals: 2                 # renewals per loan
    renewal-days: 14                # days added by each renewal
    fine-per-day: 0.25              # per started day overdue
    max-fine-per-loan: 10.00        # cap for one loan
    borrowing-blocked-above: 5.00   # unpaid fines above this block new loans
    seat-max-advance-days: 14       # how far ahead a seat can be booked
    seat-min-minutes: 15            # shortest seat booking
    max-upcoming-seat-bookings: 3   # seat bookings a student may hold that have not ended
  scheduling:
    # Runs housekeeping jobs such as expiring uncollected reservations. Tests switch it off.
    enabled: ${APP_SCHEDULING_ENABLED:true}
