spring:
  application:
    name: chapelbook
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chapelbook}
    username: ${DB_USERNAME:chapelbook}
    # No default: supply DB_PASSWORD through the environment (see .env.example).
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
